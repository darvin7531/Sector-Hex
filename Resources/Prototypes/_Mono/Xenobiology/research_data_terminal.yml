# Sprite: CC-BY-SA-3.0, cmss13; see research_terminal.rsi/meta.json.
- type: entity
  id: MonoResearchDataTerminal
  parent: BaseComputer
  name: research data terminal
  description: Generates chemical research contracts and tracks xenobiology clearance.
  components:
  - type: ResearchDataTerminal
  - type: ActivatableUI
    key: enum.ResearchDataTerminalUiKey.Key
  - type: UserInterface
    interfaces:
      enum.ResearchDataTerminalUiKey.Key:
        type: ResearchDataTerminalBoundUserInterface
  - type: Sprite
    sprite: _Mono/Xenobiology/Machines/research_terminal.rsi
    layers:
    - map: ["computerLayerBody"]
      state: research0
    - map: ["computerLayerScreen"]
      state: research
  - type: Computer
    board: MonoResearchDataTerminalCircuitboard
