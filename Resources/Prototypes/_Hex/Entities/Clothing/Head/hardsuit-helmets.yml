- type: entity
  parent: ClothingHeadHardsuitBase
  id: ClothingHeadHelmetHardsuitAssault
  name: helmet of the assault hardsuit prototype
  description: A heavily armored helmet of a prototype spacesuit, allowing the user to see in the dark thanks to a built-in night vision device.
  components:
  - type: Sprite
    sprite: _Hex/Clothing/Head/Hardsuits/ashelm.rsi
  - type: Clothing
    sprite: _Hex/Clothing/Head/Hardsuits/ashelm.rsi
  - type: PressureProtection
    highPressureMultiplier: 0.60
    lowPressureMultiplier: 1000
  - type: NightVision
    flashDurationMultiplier: 2
    isEquipment: true
  - type: ExplosionResistance
    damageCoefficient: 0.9
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.85
        Slash: 0.85
        Piercing: 0.85
        Heat: 0.9

