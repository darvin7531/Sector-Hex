name: RU entity localization audit

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-audit-report:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
    - name: Check out PR branch
      uses: actions/checkout@v4
      with:
        ref: ${{ github.head_ref }}
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Generate complete ru-RU entity audit
      run: |
        python Tools/audit_ru_entity_localization.py \
          --output Tools/ru_entity_localization_audit.json \
          --no-fail

    - name: Commit report to the audit branch
      run: |
        git config user.name "sector-hex-localization-audit[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add Tools/ru_entity_localization_audit.json
        if git diff --cached --quiet; then
          exit 0
        fi
        git commit -m "chore(locale): refresh ru-RU entity audit report"
        git push origin "HEAD:${{ github.head_ref }}"
